[package]
name = "battleground-tauri-commander-prototype"
version = "0.0.1"
description = "PROTOTYPE — Tauri supervision of a frozen Python Commander"
authors = ["Battleground"]
edition = "2021"

[lib]
name = "battleground_tauri_commander_prototype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync"] }
